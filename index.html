<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000; /* Чистый черный */
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .box {
            border: 1px solid #333;
            padding: 40px;
            border-radius: 15px;
            background: #050505;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
        }
        h1 { color: #00ff88; margin-top: 0; }
        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #ffffff;
            color: #000000;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>SYSTEM READY</h1>
        <p>Черный вход активирован.</p>
        <button onclick="window.Telegram.WebApp.close()">ЗАКРЫТЬ</button>
    </div>
    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
