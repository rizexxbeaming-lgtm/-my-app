<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#05010a" />
  <title>PULSE — Action Planner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
    <span class="grid"></span>
  </div>

  <main class="app">
    <header class="hero">
      <p class="brand">PULSE</p>
      <h1 class="headline" id="greeting">Твой день в неоне</h1>
      <p class="lede">Собирай действия. Держи фокус. Закрывай список, как сет-лист.</p>
      <div class="cta-row">
        <button type="button" class="btn btn-primary" id="quick-add" data-haptic="medium">
          <span class="btn-glow"></span>
          Новое действие
        </button>
        <button type="button" class="btn btn-ghost" id="focus-mode" data-haptic="light">Фокус</button>
      </div>
      <div class="ring-wrap" aria-hidden="true">
        <svg class="ring" viewBox="0 0 120 120">
          <circle class="ring-track" cx="60" cy="60" r="52" />
          <circle class="ring-progress" id="ring-progress" cx="60" cy="60" r="52" />
        </svg>
        <div class="ring-label">
          <strong id="progress-pct">0%</strong>
          <span>готово</span>
        </div>
      </div>
    </header>

    <section class="daystrip" aria-label="Дни недели">
      <div class="daystrip-scroll" id="daystrip"></div>
    </section>

    <section class="filters" aria-label="Фильтры">
      <button type="button" class="chip is-active" data-filter="all">Все</button>
      <button type="button" class="chip" data-filter="open">Открытые</button>
      <button type="button" class="chip" data-filter="done">Сделано</button>
      <button type="button" class="chip chip-hot" data-filter="hot">Горячие</button>
    </section>

    <section class="list-section">
      <div class="section-head">
        <h2>План</h2>
        <p id="list-meta">0 действий</p>
      </div>
      <ul class="task-list" id="task-list"></ul>
      <div class="empty" id="empty-state">
        <p class="empty-title">Пусто и красиво</p>
        <p class="empty-text">Добавь первое действие — и лента загорится.</p>
      </div>
    </section>
  </main>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <aside class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-labelledby="sheet-title">
    <div class="sheet-handle"></div>
    <h2 id="sheet-title">Новое действие</h2>
    <form id="task-form" autocomplete="off">
      <label class="field">
        <span>Что сделать</span>
        <input type="text" id="task-title" name="title" maxlength="120" placeholder="Например: созвон с командой" required />
      </label>
      <label class="field">
        <span>Время</span>
        <input type="time" id="task-time" name="time" />
      </label>
      <fieldset class="priority">
        <legend>Приоритет</legend>
        <label class="prio prio-hot"><input type="radio" name="priority" value="hot" checked /><span>Hot</span></label>
        <label class="prio prio-glow"><input type="radio" name="priority" value="glow" /><span>Glow</span></label>
        <label class="prio prio-soft"><input type="radio" name="priority" value="soft" /><span>Soft</span></label>
      </fieldset>
      <button type="submit" class="btn btn-primary btn-block" data-haptic="success">
        <span class="btn-glow"></span>
        В план
      </button>
    </form>
  </aside>

  <nav class="dock" aria-label="Навигация">
    <button type="button" class="dock-btn is-active" data-view="today" data-haptic="light">
      <span>Сегодня</span>
    </button>
    <button type="button" class="dock-fab" id="dock-add" data-haptic="medium" aria-label="Добавить">
      <span>+</span>
    </button>
    <button type="button" class="dock-btn" data-view="week" data-haptic="light">
      <span>Неделя</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
